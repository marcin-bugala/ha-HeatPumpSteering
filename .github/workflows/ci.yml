name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'docs/**', 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_integration: ${{ steps.repository.outputs.has_integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests/bootstrap -v
      - id: repository
        run: python tools/check_repository.py --github-output "$GITHUB_OUTPUT"

  ha-tests:
    needs: quality
    if: needs.quality.outputs.has_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-ha-test.txt
      - run: python -m pytest tests/integration

  hassfest:
    needs: quality
    if: needs.quality.outputs.has_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  ci:
    if: always()
    needs: [quality, ha-tests, hassfest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QUALITY: ${{ needs.quality.result }}
      HAS_INTEGRATION: ${{ needs.quality.outputs.has_integration }}
      HA_TESTS: ${{ needs.ha-tests.result }}
      HASSFEST: ${{ needs.hassfest.result }}
    steps:
      - name: Require successful applicable checks
        shell: bash
        run: |
          test "$QUALITY" = success
          if [ "$HAS_INTEGRATION" = true ]; then
            test "$HA_TESTS" = success
            test "$HASSFEST" = success
          else
            test "$HA_TESTS" = skipped
            test "$HASSFEST" = skipped
            echo "Documentation/tooling stage: HA tests and hassfest not applicable."
          fi
