name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'docs/**', 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_integration: ${{ steps.repository.outputs.has_integration }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m unittest discover -s tests/bootstrap -v
      - id: repository
        run: python tools/check_repository.py --github-output "$GITHUB_OUTPUT"

  ha-tooling:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [minimum, current]
    env:
      HA_TEST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Build current fixtures twice from pinned Core
        if: matrix.target == 'current'
        run: |
          python -m pip install -r tools/ha_test_tooling/requirements-build.txt
          python tools/ha_test_tooling/build.py --fetch --core .ha-tooling/core --output .ha-tooling/current
          python -m pip install -r tools/ha_test_tooling/requirements-current.txt .ha-tooling/current/wheel-1/*.whl
      - name: Install released minimum fixtures
        if: matrix.target == 'minimum'
        run: python -m pip install -r tools/ha_test_tooling/requirements-minimum.txt
      - run: python -m pip check
      - name: Record installed environment
        run: |
          python --version
          python -m pip list --format=freeze
      - name: Exercise real fixtures without device network access
        run: python -m pytest tests/ha_tooling -v -s --disable-socket --allow-unix-socket

  ha-tests:
    needs: [quality, ha-tooling]
    if: needs.quality.outputs.has_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [minimum, current]
    env:
      HA_TEST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Build and install current fixtures
        if: matrix.target == 'current'
        run: |
          python -m pip install -r tools/ha_test_tooling/requirements-build.txt
          python tools/ha_test_tooling/build.py --fetch --core .ha-tooling/core --output .ha-tooling/current
          python -m pip install -r tools/ha_test_tooling/requirements-current.txt .ha-tooling/current/wheel-1/*.whl
      - name: Install minimum fixtures
        if: matrix.target == 'minimum'
        run: python -m pip install -r requirements-ha-test.txt
      - run: python -m pip check
      - run: python -m pytest tests/integration -v --disable-socket --allow-unix-socket

  hassfest:
    needs: quality
    if: needs.quality.outputs.has_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  ci:
    if: always()
    needs: [quality, ha-tooling, ha-tests, hassfest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QUALITY: ${{ needs.quality.result }}
      HA_TOOLING: ${{ needs.ha-tooling.result }}
      HAS_INTEGRATION: ${{ needs.quality.outputs.has_integration }}
      HA_TESTS: ${{ needs.ha-tests.result }}
      HASSFEST: ${{ needs.hassfest.result }}
    steps:
      - name: Require successful applicable checks
        shell: bash
        run: |
          test "$QUALITY" = success
          test "$HA_TOOLING" = success
          if [ "$HAS_INTEGRATION" = true ]; then
            test "$HA_TESTS" = success
            test "$HASSFEST" = success
          else
            test "$HA_TESTS" = skipped
            test "$HASSFEST" = skipped
            echo "Documentation/tooling stage: HA tests and hassfest not applicable."
          fi
