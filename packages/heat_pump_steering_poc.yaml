input_number:
  hp_poc_cel_parter:
    name: Ogrzewanie POC · cel parter
    min: 18
    max: 24
    step: 0.1
    unit_of_measurement: °C
    mode: box
  hp_poc_cel_pietro:
    name: Ogrzewanie POC · cel piętro
    min: 18
    max: 24
    step: 0.1
    unit_of_measurement: °C
    mode: box
input_boolean:
  hp_poc_auto_stop_co1:
    name: Ogrzewanie POC · auto STOP przy przegrzaniu
    icon: mdi:thermostat-auto
  hp_poc_co1_wylaczony_przez_poc:
    name: Ogrzewanie POC · CO1 wstrzymany przez POC
    icon: mdi:pause-circle
  hp_poc_cele_zainicjalizowane:
    name: Ogrzewanie POC · cele zainicjalizowane
input_datetime:
  hp_poc_ostatnia_proba_co1_on_off:
    name: Ogrzewanie POC · ostatnia próba ON/OFF
    has_date: true
    has_time: true
  hp_poc_ostatnia_proba:
    name: Ogrzewanie POC · ostatnia próba zapisu
    has_date: true
    has_time: true
template:
- binary_sensor:
  - name: hp_poc_dane_stref_ok
    unique_id: hp_poc_dane_stref_ok
    default_entity_id: binary_sensor.hp_poc_dane_stref_ok
    state: |-
      {% set ns = namespace(ok=true) %} {% for e in ['sensor.salon_termometr_salon', 'sensor.korytarz_termometr_pietro'] %}
        {% set s = states[e] %}
        {% if s is not defined or not is_number(s.state)
              or not (10 <= s.state | float(0) <= 35)
              or not (0 <= as_timestamp(now()) - as_timestamp(s.last_reported, 0) < 7200) %}
          {% set ns.ok = false %}
        {% endif %}
      {% endfor %} {{ ns.ok and is_state('input_boolean.hp_poc_cele_zainicjalizowane', 'on')
         and is_number(states('input_number.hp_poc_cel_parter'))
         and is_number(states('input_number.hp_poc_cel_pietro'))
         and is_number(states('sensor.hp_poc_parter_komfort_trwaly'))
         and is_number(states('sensor.hp_poc_pietro_komfort_trwaly'))
         and state_attr('sensor.hp_poc_parter_komfort_trwaly', 'age_coverage_ratio') | float(0) >= 0.8
         and state_attr('sensor.hp_poc_pietro_komfort_trwaly', 'age_coverage_ratio') | float(0) >= 0.8
         and states('sensor.hp_poc_parter_liczba_probek_trwaly') | int(0) >= 29
         and states('sensor.hp_poc_pietro_liczba_probek_trwaly') | int(0) >= 29 }}
  - name: hp_poc_obie_strefy_przegrzane
    unique_id: hp_poc_obie_strefy_przegrzane
    default_entity_id: binary_sensor.hp_poc_obie_strefy_przegrzane
    state: |-
      {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
      {{ is_state('binary_sensor.hp_poc_dane_stref_ok', 'on') and p.get('hot_seconds', 0) | float(0) >= 1800 }}
  - name: hp_poc_potrzeba_grzania
    unique_id: hp_poc_potrzeba_grzania
    default_entity_id: binary_sensor.hp_poc_potrzeba_grzania
    state: |-
      {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
      {{ is_state('binary_sensor.hp_poc_dane_stref_ok', 'on') and p.get('cold_seconds', 0) | float(0) >= 1800 }}
  - name: hp_poc_brak_danych_stref
    unique_id: hp_poc_brak_danych_stref
    default_entity_id: binary_sensor.hp_poc_brak_danych_stref
    delay_on:
      minutes: 30
    state: '{{ not is_state(''binary_sensor.hp_poc_dane_stref_ok'', ''on'') }}'
  sensor:
  - name: hp_poc_status
    unique_id: hp_poc_status
    default_entity_id: sensor.hp_poc_status
    state: |-
      {% set required = ['sensor.hp_poc_probka_parter', 'sensor.hp_poc_probka_pietro',
                         'sensor.hp_poc_probka_outdoor', 'sensor.hp_poc_parter_komfort_trwaly',
                         'sensor.hp_poc_pietro_komfort_trwaly', 'sensor.hp_poc_outdoor_2h_trwaly',
                         'sensor.hp_poc_parter_liczba_probek_trwaly', 'sensor.hp_poc_pietro_liczba_probek_trwaly',
                         'sensor.hp_poc_outdoor_liczba_probek_trwaly', 'sensor.hp_poc_parter_zmiana_12h_trwaly',
                         'sensor.hp_poc_pietro_zmiana_12h_trwaly'] %}
      {% set existing = states | map(attribute='entity_id') | list %} {% set ns = namespace(missing=false) %} {% for e in required %}
        {% if e not in existing %}{% set ns.missing = true %}{% endif %}
      {% endfor %} {% if ns.missing %}brak_encji {% elif not is_state('input_boolean.hp_poc_cele_zainicjalizowane', 'on') %}brak_inicjalizacji_celow {% elif states('sensor.hp_poc_probka_parter') in ['unknown', 'unavailable']
           or states('sensor.hp_poc_probka_pietro') in ['unknown', 'unavailable']
           or states('sensor.hp_poc_probka_outdoor') in ['unknown', 'unavailable'] %}brak_swiezych_probek
      {% elif states('sensor.hp_poc_co1_propozycja') == 'unknown' %}oczekiwanie_na_obliczenie {% elif not is_number(states('sensor.hp_poc_co1_propozycja')) %}blokada_danych_lub_rozgrzewanie {% else %}obliczenia_gotowe{% endif %}
    attributes:
      missing_entities: |-
        {% set existing = states | map(attribute='entity_id') | list %} {% set required = ['sensor.hp_poc_probka_parter', 'sensor.hp_poc_probka_pietro',
                           'sensor.hp_poc_probka_outdoor', 'sensor.hp_poc_parter_komfort_trwaly',
                           'sensor.hp_poc_pietro_komfort_trwaly', 'sensor.hp_poc_outdoor_2h_trwaly',
                           'sensor.hp_poc_parter_liczba_probek_trwaly', 'sensor.hp_poc_pietro_liczba_probek_trwaly',
                           'sensor.hp_poc_outdoor_liczba_probek_trwaly', 'sensor.hp_poc_parter_zmiana_12h_trwaly',
                           'sensor.hp_poc_pietro_zmiana_12h_trwaly'] %}
        {% set ns = namespace(items=[]) %} {% for e in required %}
          {% if e not in existing %}{% set ns.items = ns.items + [e] %}{% endif %}
        {% endfor %} {{ ns.items }}
      invalid_inputs: |-
        {% set ns = namespace(items=[]) %} {% for e in ['sensor.salon_termometr_salon', 'sensor.korytarz_termometr_pietro',
                     'sensor.garaz_pompa_ciepla_outdoor_ambient_temp',
                     'sensor.garaz_pompa_ciepla_circuit_1_water_temp',
                     'number.garaz_pompa_ciepla_circuit_1_setpoint'] %}
          {% if not is_number(states(e)) %}{% set ns.items = ns.items + [e] %}{% endif %}
        {% endfor %} {{ ns.items }}
      next_calculation: Co 5 minut, w 30. sekundzie minuty
- triggers:
  - trigger: time_pattern
    minutes: /5
    seconds: '0'
  sensor:
  - name: hp_poc_probka_parter
    unique_id: hp_poc_probka_parter
    default_entity_id: sensor.hp_poc_probka_parter
    unit_of_measurement: °C
    device_class: temperature
    attributes:
      sampled_at: '{{ now().isoformat() }}'
    availability: |-
      {% set s = states.sensor.salon_termometr_salon %} {{ s is defined and is_number(s.state)
         and 10 <= s.state | float <= 35
         and 0 <= as_timestamp(now()) - as_timestamp(s.last_reported, 0) < 7200 }}
    state: '{{ states(''sensor.salon_termometr_salon'') | float(0) }}'
  - name: hp_poc_probka_pietro
    unique_id: hp_poc_probka_pietro
    default_entity_id: sensor.hp_poc_probka_pietro
    unit_of_measurement: °C
    device_class: temperature
    attributes:
      sampled_at: '{{ now().isoformat() }}'
    availability: |-
      {% set s = states.sensor.korytarz_termometr_pietro %} {{ s is defined and is_number(s.state)
         and 10 <= s.state | float <= 35
         and 0 <= as_timestamp(now()) - as_timestamp(s.last_reported, 0) < 7200 }}
    state: '{{ states(''sensor.korytarz_termometr_pietro'') | float(0) }}'
  - name: hp_poc_probka_outdoor
    unique_id: hp_poc_probka_outdoor
    default_entity_id: sensor.hp_poc_probka_outdoor
    unit_of_measurement: °C
    device_class: temperature
    attributes:
      sampled_at: '{{ now().isoformat() }}'
    availability: |-
      {% set s = states.sensor.garaz_pompa_ciepla_outdoor_ambient_temp %} {{ s is defined and is_number(s.state)
         and -35 <= s.state | float <= 35
         and 0 <= as_timestamp(now()) - as_timestamp(s.last_reported, 0) < 1800 }}
    state: '{{ states(''sensor.garaz_pompa_ciepla_outdoor_ambient_temp'') | float(0) }}'
- triggers:
  - trigger: time_pattern
    minutes: /5
    seconds: '30'
  actions:
  - variables:
      co1_entity: number.garaz_pompa_ciepla_circuit_1_setpoint
      poc_max: 35
      gradient: 0.2
      deadband: 0.2
      gain: 1.5
      correction_limit: 2
      ground: '{{ states(''sensor.hp_poc_parter_komfort_trwaly'') | float(0) }}'
      upper: '{{ states(''sensor.hp_poc_pietro_komfort_trwaly'') | float(0) }}'
      outdoor: '{{ states(''sensor.hp_poc_outdoor_2h_trwaly'') | float(0) }}'
      target_ground: '{{ states(''input_number.hp_poc_cel_parter'') | float(21) }}'
      target_upper: '{{ states(''input_number.hp_poc_cel_pietro'') | float(22) }}'
      trend_ready: |-
        {{ is_number(states('sensor.hp_poc_parter_zmiana_12h_trwaly'))
           and is_number(states('sensor.hp_poc_pietro_zmiana_12h_trwaly'))
           and state_attr('sensor.hp_poc_parter_zmiana_12h_trwaly', 'age_coverage_ratio') | float(0) >= 0.8
           and state_attr('sensor.hp_poc_pietro_zmiana_12h_trwaly', 'age_coverage_ratio') | float(0) >= 0.8 }}
  - variables:
      lower: '{{ state_attr(co1_entity, ''min'') | float(0) | round(0, ''ceil'') | int }}'
      ceiling: '{{ [poc_max, state_attr(co1_entity, ''max'') | float(poc_max)] | min | round(0, ''floor'') | int
        }}'
      error_ground: '{{ target_ground - ground }}'
      error_upper: '{{ target_upper - upper }}'
      base: '{{ 20 + gradient * (20 - outdoor) }}'
      warming: '{% set a = states(''sensor.hp_poc_parter_zmiana_12h_trwaly'') | float(0) %} {% set b = states(''sensor.hp_poc_pietro_zmiana_12h_trwaly'')
        | float(0) %} {{ [a, b] | max if trend_ready else 0 }}'
      data_ok: |-
        {% set ns = namespace(ok=true) %} {% for entity in ['sensor.hp_poc_probka_parter', 'sensor.hp_poc_probka_pietro',
                          'sensor.hp_poc_probka_outdoor', 'sensor.hp_poc_parter_komfort_trwaly',
                          'sensor.hp_poc_pietro_komfort_trwaly', 'sensor.hp_poc_outdoor_2h_trwaly',
                          'input_number.hp_poc_cel_parter', 'input_number.hp_poc_cel_pietro',
                          'sensor.garaz_pompa_ciepla_circuit_1_water_temp', co1_entity] %}
          {% if not is_number(states(entity)) %}{% set ns.ok = false %}{% endif %}
        {% endfor %} {% set water = states.sensor.garaz_pompa_ciepla_circuit_1_water_temp %} {{ ns.ok and water is defined
           and 0 <= as_timestamp(now()) - as_timestamp(water.last_reported, 0) < 1800
           and 5 <= states(water.entity_id) | float(0) <= 65
           and state_attr(co1_entity, 'unit_of_measurement') == '°C'
           and is_number(state_attr(co1_entity, 'min'))
           and is_number(state_attr(co1_entity, 'max'))
           and state_attr(co1_entity, 'step') | float(0) == 1
           and state_attr('sensor.hp_poc_parter_komfort_trwaly', 'age_coverage_ratio') | float(0) >= 0.8
           and state_attr('sensor.hp_poc_pietro_komfort_trwaly', 'age_coverage_ratio') | float(0) >= 0.8
           and state_attr('sensor.hp_poc_outdoor_2h_trwaly', 'age_coverage_ratio') | float(0) >= 0.8
           and states('sensor.hp_poc_parter_liczba_probek_trwaly') | int(0) >= 29
           and states('sensor.hp_poc_pietro_liczba_probek_trwaly') | int(0) >= 29
           and states('sensor.hp_poc_outdoor_liczba_probek_trwaly') | int(0) >= 20
           and is_state('input_boolean.hp_poc_cele_zainicjalizowane', 'on') }}
  - variables:
      error: |-
        {{ [error_ground, error_upper] | min
           if [error_ground, error_upper] | min < -deadband
           else (error_ground + error_upper) / 2 }}
      block_increase: |-
        {{ states('sensor.hp_poc_probka_parter') | float(0) < ground - 0.7
           or states('sensor.hp_poc_probka_pietro') | float(0) < upper - 0.7
           or states('sensor.hp_poc_probka_parter') | float(0) > target_ground + deadband
           or states('sensor.hp_poc_probka_pietro') | float(0) > target_upper + deadband }}
  - variables:
      correction: '{% set e = error | float %} {% set comfort = 0 if e | abs <= deadband else gain * (e - deadband
        if e > 0 else e + deadband) %} {% set trend = [0.5, [0, warming | float - 0.15] | max * 0.5] | min %} {{
        [-correction_limit, [correction_limit, comfort - trend] | min] | max }}'
  - variables:
      unclamped: '{{ base + correction }}'
      rounded: '{% set bounded = [lower, [ceiling, base + correction] | min] | max %} {{ (bounded + 0.5) | round(0,
        ''floor'') | int }}'
      ready: '{{ data_ok and lower <= ceiling }}'
  sensor:
  - name: hp_poc_co1_propozycja
    unique_id: hp_poc_co1_propozycja
    default_entity_id: sensor.hp_poc_co1_propozycja
    unit_of_measurement: °C
    device_class: temperature
    availability: '{{ ready }}'
    state: '{{ rounded }}'
    attributes:
      calculated_at: '{{ now().isoformat() }}'
      co1_entity: '{{ co1_entity }}'
      base: '{{ base | round(2) }}'
      correction: '{{ correction | round(2) }}'
      unclamped: '{{ unclamped | round(2) }}'
      lower_limit: '{{ lower }}'
      upper_limit: '{{ ceiling }}'
      limited: '{{ unclamped < lower or unclamped > ceiling }}'
      ground_comfort: '{{ ground }}'
      upper_comfort: '{{ upper }}'
      error_ground: '{{ error_ground | round(2) }}'
      error_upper: '{{ error_upper | round(2) }}'
      trend_ready: '{{ trend_ready }}'
      warming_12h: '{{ warming | round(2) }}'
      block_increase: '{{ block_increase }}'
      water_actual: '{{ states(''sensor.garaz_pompa_ciepla_circuit_1_water_temp'') }}'
      power_raw: '{{ states(''sensor.pompa_ciepla_moc'') }}'
      reason: '{% if not ready %}brak_danych_lub_rozgrzewanie_filtrow {% elif lower > unclamped %}ograniczenie_minimum_co1
        {% elif ceiling < unclamped %}ograniczenie_maksimum_co1 {% elif error < -deadband %}obnizanie_przegrzewanie
        {% elif block_increase %}blokada_podnoszenia_zaklocenie_lub_cieplo {% elif error > deadband %}korekta_niedogrzania
        {% else %}pasmo_komfortu{% endif %}'
- triggers:
  - trigger: time_pattern
    minutes: /5
    seconds: '15'
  sensor:
  - name: hp_poc_probka_trend_parter
    unique_id: hp_poc_probka_trend_parter
    default_entity_id: sensor.hp_poc_probka_trend_parter
    unit_of_measurement: °C
    device_class: temperature
    availability: |-
      {{ is_number(states('sensor.hp_poc_parter_komfort_trwaly'))
         and is_number(states('sensor.hp_poc_probka_parter')) }}
    state: '{{ states(''sensor.hp_poc_parter_komfort_trwaly'') | float(0) }}'
    attributes:
      sampled_at: '{{ now().isoformat() }}'
  - name: hp_poc_probka_trend_pietro
    unique_id: hp_poc_probka_trend_pietro
    default_entity_id: sensor.hp_poc_probka_trend_pietro
    unit_of_measurement: °C
    device_class: temperature
    availability: |-
      {{ is_number(states('sensor.hp_poc_pietro_komfort_trwaly'))
         and is_number(states('sensor.hp_poc_probka_pietro')) }}
    state: '{{ states(''sensor.hp_poc_pietro_komfort_trwaly'') | float(0) }}'
    attributes:
      sampled_at: '{{ now().isoformat() }}'
sensor:
- platform: statistics
  name: hp_poc_parter_liczba_probek
  unique_id: hp_poc_parter_liczba_probek
  entity_id: sensor.hp_poc_probka_parter
  state_characteristic: count
  sampling_size: 1000
  max_age:
    hours: 3
- platform: statistics
  name: hp_poc_pietro_liczba_probek
  unique_id: hp_poc_pietro_liczba_probek
  entity_id: sensor.hp_poc_probka_pietro
  state_characteristic: count
  sampling_size: 1000
  max_age:
    hours: 3
- platform: statistics
  name: hp_poc_outdoor_liczba_probek
  unique_id: hp_poc_outdoor_liczba_probek
  entity_id: sensor.hp_poc_probka_outdoor
  state_characteristic: count
  sampling_size: 1000
  max_age:
    hours: 2
- platform: statistics
  name: hp_poc_parter_komfort
  unique_id: hp_poc_parter_komfort
  entity_id: sensor.hp_poc_probka_parter
  state_characteristic: median
  sampling_size: 1000
  max_age:
    hours: 3
  precision: 2
- platform: statistics
  name: hp_poc_pietro_komfort
  unique_id: hp_poc_pietro_komfort
  entity_id: sensor.hp_poc_probka_pietro
  state_characteristic: median
  sampling_size: 1000
  max_age:
    hours: 3
  precision: 2
- platform: statistics
  name: hp_poc_outdoor_2h
  unique_id: hp_poc_outdoor_2h
  entity_id: sensor.hp_poc_probka_outdoor
