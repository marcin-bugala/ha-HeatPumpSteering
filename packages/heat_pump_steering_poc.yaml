- platform: statistics
  name: hp_poc_parter_zmiana_12h
  unique_id: hp_poc_parter_zmiana_12h
  entity_id: sensor.hp_poc_probka_trend_parter
  state_characteristic: change
  sampling_size: 1000
  max_age:
    hours: 12
  precision: 2
- platform: statistics
  name: hp_poc_pietro_zmiana_12h
  unique_id: hp_poc_pietro_zmiana_12h
  entity_id: sensor.hp_poc_probka_trend_pietro
  state_characteristic: change
  sampling_size: 1000
  max_age:
    hours: 12
  precision: 2
automation:
- id: hp_poc_auto_stop_co1
  alias: Ogrzewanie POC · auto STOP CO1
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /1
    seconds: '10'
  conditions:
  - condition: state
    entity_id: input_boolean.hp_poc_auto_stop_co1
    state: 'on'
  - condition: template
    value_template: |-
      {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
      {% set s = states.switch.garaz_pompa_ciepla_circuit_1_heating %} {{ s is defined and s.state in ['on', 'off'] and s.state == p.get('co1')
         and 0 <= as_timestamp(now()) - p.get('updated', 0) < 600
         and as_timestamp(now()) - p.get('co1_since', as_timestamp(now())) >= 7200
         and as_timestamp(now()) - as_timestamp(states('input_datetime.hp_poc_ostatnia_proba_co1_on_off'), 0) >= 900 }}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
        state: 'on'
      - condition: state
        entity_id: binary_sensor.hp_poc_obie_strefy_przegrzane
        state: 'on'
      - condition: state
        entity_id: binary_sensor.hp_poc_dane_stref_ok
        state: 'on'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hp_poc_ostatnia_proba_co1_on_off
        data:
          timestamp: '{{ as_timestamp(now()) }}'
      - action: switch.turn_off
        target:
          entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
      - wait_template: '{{ is_state(''switch.garaz_pompa_ciepla_circuit_1_heating'', ''off'') }}'
        timeout: 00:00:30
        continue_on_timeout: false
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hp_poc_co1_wylaczony_przez_poc
      - action: logbook.log
        data:
          name: Ogrzewanie POC
          entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
          message: Wysłano STOP CO1 — obie mediany komfortu ≥ cel +0,4°C przez 30 min. Pompa zachowuje własną logikę
            ochrony i CWU.
    - conditions:
      - condition: state
        entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
        state: 'off'
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: state
            entity_id: binary_sensor.hp_poc_dane_stref_ok
            state: 'on'
          - condition: state
            entity_id: binary_sensor.hp_poc_potrzeba_grzania
            state: 'on'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_boolean.hp_poc_co1_wylaczony_przez_poc
            state: 'on'
          - condition: state
            entity_id: binary_sensor.hp_poc_brak_danych_stref
            state: 'on'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.hp_poc_ostatnia_proba_co1_on_off
        data:
          timestamp: '{{ as_timestamp(now()) }}'
      - action: switch.turn_on
        target:
          entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
      - wait_template: '{{ is_state(''switch.garaz_pompa_ciepla_circuit_1_heating'', ''on'') }}'
        timeout: 00:00:30
        continue_on_timeout: false
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hp_poc_co1_wylaczony_przez_poc
      - action: logbook.log
        data:
          name: Ogrzewanie POC
          entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
          message: |-
            Wysłano START CO1 — {{ 'brak danych stref przez 30 min; powrót do ogrzewania Hisense'
               if is_state('binary_sensor.hp_poc_brak_danych_stref', 'on')
               else 'co najmniej jedna mediana ≤ cel −0,2°C przez 30 min' }}.
- id: hp_poc_co1_kasuj_wlasnosc
  alias: Ogrzewanie POC · zwolnienie sterowania STOP
  mode: restart
  triggers:
  - trigger: state
    entity_id: switch.garaz_pompa_ciepla_circuit_1_heating
    to: 'on'
  - trigger: state
    entity_id: input_boolean.hp_poc_auto_stop_co1
    to: 'off'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hp_poc_co1_wylaczony_przez_poc
- id: hp_poc_inicjalizacja_celow
  alias: Ogrzewanie POC · inicjalizacja celów
  mode: single
  triggers:
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.hp_poc_cele_zainicjalizowane
    state: 'off'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.hp_poc_cel_parter
    data:
      value: 21
  - action: input_number.set_value
    target:
      entity_id: input_number.hp_poc_cel_pietro
    data:
      value: 22
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hp_poc_cele_zainicjalizowane
- id: hp_poc_zapis_co1
  alias: Ogrzewanie POC · zapis CO1
  description: Zwykły number.set_value przez HiMitII. Pełne stopnie, tylko zmiana, najwyżej 1°C co 120 min. Nie
    steruje sprężarką, CWU, zaworami ani demand. Wyłączenie tej automatyzacji zatrzymuje zapis; sensory nadal liczą.
  mode: single
  triggers:
  - trigger: time_pattern
    minutes: /5
    seconds: '45'
  variables:
    co1_entity: number.garaz_pompa_ciepla_circuit_1_setpoint
    proposal_entity: sensor.hp_poc_co1_propozycja
  conditions:
  - condition: template
    value_template: |-
      {{ is_number(states(co1_entity)) and is_number(states(proposal_entity))
         and state_attr(proposal_entity, 'co1_entity') == co1_entity
         and 0 <= as_timestamp(now()) - as_timestamp(state_attr(proposal_entity, 'calculated_at'), 0) < 600
         and is_state('switch.garaz_pompa_ciepla_circuit_1_heating', 'on') }}
  actions:
  - variables:
      current: '{{ states(co1_entity) | float }}'
      wanted: '{{ states(proposal_entity) | int }}'
      lower: '{{ state_attr(proposal_entity, ''lower_limit'') | int }}'
      ceiling: '{{ state_attr(proposal_entity, ''upper_limit'') | int }}'
  - variables:
      next_value: '{{ current + 1 if wanted > current else current - 1 if wanted < current else current }}'
  - condition: template
    value_template: |-
      {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
      {% set s = states[co1_entity] %} {% set last_try = as_timestamp(states('input_datetime.hp_poc_ostatnia_proba'), 0) %} {% set ns = namespace(ok=true) %} {% for entity, age in [('sensor.salon_termometr_salon', 7200),
                            ('sensor.korytarz_termometr_pietro', 7200),
                            ('sensor.garaz_pompa_ciepla_outdoor_ambient_temp', 1800),
                            ('sensor.garaz_pompa_ciepla_circuit_1_water_temp', 1800)] %}
        {% set source = states[entity] %}
        {% if source is not defined or not is_number(source.state) or not (0 <= as_timestamp(now()) - as_timestamp(source.last_reported, 0) < age) %}
          {% set ns.ok = false %}
        {% endif %}
      {% endfor %} {{ ns.ok and current == p.get('setpoint')
         and 0 <= as_timestamp(now()) - p.get('updated', 0) < 600
         and current == current | round(0)
         and current != wanted and lower <= next_value <= ceiling
         and state_attr(co1_entity, 'unit_of_measurement') == '°C'
         and state_attr(co1_entity, 'step') | float(0) == 1
         and is_number(state_attr(co1_entity, 'min'))
         and is_number(state_attr(co1_entity, 'max'))
         and state_attr(co1_entity, 'min') | float <= next_value <= state_attr(co1_entity, 'max') | float
         and (next_value < current or not state_attr(proposal_entity, 'block_increase'))
         and as_timestamp(now()) - p.get('setpoint_since', as_timestamp(now())) >= 7200
         and as_timestamp(now()) - last_try >= 7200 }}
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.hp_poc_ostatnia_proba
    data:
      timestamp: '{{ as_timestamp(now()) }}'
  - action: number.set_value
    target:
      entity_id: '{{ co1_entity }}'
    data:
      value: '{{ next_value | int }}'
  - action: logbook.log
    data:
      name: Ogrzewanie POC
      entity_id: '{{ co1_entity }}'
      message: Wysłano CO1 {{ current }} → {{ next_value | int }}°C; docelowo {{ wanted }}°C. {{ state_attr(proposal_entity,
        'reason') }}. Przyjęcie przez pompę nie zostało niezależnie potwierdzone.
