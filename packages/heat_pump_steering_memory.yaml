hp_poc_history: {}

template:
- triggers:
  - trigger: event
    event_type: hp_poc_history_loaded
    event_data:
      entities:
      - sensor.salon_termometr_salon
      - sensor.korytarz_termometr_pietro
      - sensor.garaz_pompa_ciepla_outdoor_ambient_temp
      - switch.garaz_pompa_ciepla_circuit_1_heating
      - number.garaz_pompa_ciepla_circuit_1_setpoint
  - trigger: time_pattern
    minutes: /5
    seconds: '0'
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id:
    - switch.garaz_pompa_ciepla_circuit_1_heating
    - number.garaz_pompa_ciepla_circuit_1_setpoint
    - input_number.hp_poc_cel_parter
    - input_number.hp_poc_cel_pietro
    to: null
  sensor:
  - name: hp_poc_pamiec
    unique_id: hp_poc_pamiec
    default_entity_id: sensor.hp_poc_pamiec
    state: '{{ as_timestamp(now()) | int }}'
    attributes:
      payload: |-
        {% from 'hp_poc_memory.jinja' import fresh_temperature, next_memory, merge_history %}
        {% set fresh = fresh_temperature | as_function %}
        {% set advance = next_memory | as_function %}
        {% set stamp = as_timestamp(now()) %}
        {% set old = this.attributes.get('payload', {}) %}
        {% if trigger is defined and trigger.platform == 'event' %}
          {% set merge = merge_history | as_function %}
          {% set old = merge(old, trigger.event.data, stamp) %}
        {% endif %}
        {{ advance(old, stamp,
           fresh('sensor.salon_termometr_salon', stamp, 7200, 10, 35),
           fresh('sensor.korytarz_termometr_pietro', stamp, 7200, 10, 35),
           fresh('sensor.garaz_pompa_ciepla_outdoor_ambient_temp', stamp, 1800, -35, 35),
           states('input_number.hp_poc_cel_parter') | float(21),
           states('input_number.hp_poc_cel_pietro') | float(22),
           states('switch.garaz_pompa_ciepla_circuit_1_heating'),
           states('number.garaz_pompa_ciepla_circuit_1_setpoint')) }}
- sensor:
  - name: hp_poc_parter_komfort_trwaly
    unique_id: hp_poc_parter_komfort_trwaly
    default_entity_id: sensor.hp_poc_parter_komfort_trwaly
    availability: |-
      {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
      {{ 0 <= as_timestamp(now()) - p.get('updated', 0) < 600 and p.get('ground', {}).get('ready', false) }}
    state: |-
      {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
      {{ p.get('ground', {}).get('value', 0) | default(0, true) | round(2) }}
    attributes:
      age_coverage_ratio: |-
        {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
        {{ p.get('ground', {}).get('coverage', 0) | round(3) }}
      source_value_valid: |-
        {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
        {{ p.get('ground', {}).get('ready', false) }}
      max_gap_seconds: |-
        {% set p = state_attr('sensor.hp_poc_pamiec', 'payload') or {} %}
        {{ p.get('ground', {}).get('max_gap', 0) | round(0) }}
    unit_of_measurement: °C
    device_class: temperature
