title: Ogrzewanie POC
views:
  - title: CO1
    path: co1
    cards:
      - type: entities
        title: Sterowanie
        show_header_toggle: false
        entities:
          - input_number.hp_poc_cel_parter
          - input_number.hp_poc_cel_pietro
          - input_boolean.hp_poc_auto_stop_co1
          - entity: switch.garaz_pompa_ciepla_circuit_1_heating
            name: Ogrzewanie CO1 — stan i ręczne sterowanie
          - type: simple-entity
            entity: input_boolean.hp_poc_co1_wylaczony_przez_poc
            name: CO1 wstrzymany przez POC
          - automation.ogrzewanie_poc_zapis_co1
          - number.garaz_pompa_ciepla_circuit_1_setpoint
          - sensor.hp_poc_co1_propozycja
          - input_datetime.hp_poc_ostatnia_proba
      - type: markdown
        title: Decyzja algorytmu
        content: >-
          {% set e = 'sensor.hp_poc_co1_propozycja' %}
          {% if not is_number(states(e)) %}
          **Status: {{ states('sensor.hp_poc_status') }}**

          {% set missing = state_attr('sensor.hp_poc_status', 'missing_entities') or [] %}
          {% if missing %}
          Brakuje encji: {{ missing | join(', ') }}.
          Sprawdź pełny plik pakietu, wykonaj restart HA i sprawdź dzienniki
          integracji Statistics. Brak encji nie jest rozgrzewaniem filtrów.
          {% else %}
          Próbki: parter {{ states('sensor.hp_poc_parter_liczba_probek') }}/29,
          piętro {{ states('sensor.hp_poc_pietro_liczba_probek') }}/29,
          outdoor {{ states('sensor.hp_poc_outdoor_liczba_probek') }}/20.
          Filtry potrzebują około 2,5 h prawidłowych próbek.
          {% endif %}

          {% set invalid = state_attr('sensor.hp_poc_status', 'invalid_inputs') or [] %}
          {% if invalid %}Nieprawidłowe wejścia: {{ invalid | join(', ') }}.{% endif %}

          Jeśli status to `unknown`, sprawdź instalację poprawionej wersji
          pakietu oraz dzienniki. Obliczenie odbywa się co 5 minut.
          {% else %}
          **Cel CO1: {{ states(e) }}°C** — {{ state_attr(e, 'reason') }}

          Baza {{ state_attr(e, 'base') }}°C,
          korekta {{ state_attr(e, 'correction') }}°C,
          przed limitami {{ state_attr(e, 'unclamped') }}°C.

          Zakres {{ state_attr(e, 'lower_limit') }}–{{ state_attr(e, 'upper_limit') }}°C.
          Ograniczenie zakresu: {{ state_attr(e, 'limited') }}.

          Komfort: parter {{ state_attr(e, 'ground_comfort') }}°C,
          piętro {{ state_attr(e, 'upper_comfort') }}°C.
          Trend gotowy: {{ state_attr(e, 'trend_ready') }}.
          Blokada podnoszenia: {{ state_attr(e, 'block_increase') }}.

          Zapis: najwyżej 1°C co 2 h, tylko inna nastawa i włączony CO1.
          Odczyt HiMitII może być optymistyczny.
          {% endif %}
      - type: history-graph
        title: Opcjonalne wyłączanie ogrzewania
        hours_to_show: 24
        entities:
          - switch.garaz_pompa_ciepla_circuit_1_heating
          - binary_sensor.hp_poc_obie_strefy_przegrzane
          - binary_sensor.hp_poc_potrzeba_grzania
      - type: markdown
        title: Zasady auto STOP
        content: >-
          Domyślnie wyłączone. STOP: **obie mediany ≥ cel +0,4°C przez 30 min**.
          START: **jedna mediana ≤ cel −0,2°C przez 30 min**, bez nagłego
          spadku surowej temperatury. Minimum 2 h pracy i 2 h przerwy.

          Wznawia wyłącznie ogrzewanie zatrzymane przez POC.
          Brak danych stref przez 30 min podczas przerwy POC powoduje
          powrót do ogrzewania Hisense po minimalnej przerwie.

          Wyłączenie opcji pozostawia CO1 w aktualnym stanie i oddaje
          sterowanie ręczne. Jeśli chcesz grzać od razu, włącz CO1 powyżej.
      - type: history-graph
        title: Komfort kondygnacji
        hours_to_show: 24
        entities:
          - sensor.salon_termometr_salon
          - sensor.korytarz_termometr_pietro
          - sensor.hp_poc_parter_komfort
          - sensor.hp_poc_pietro_komfort
          - input_number.hp_poc_cel_parter
          - input_number.hp_poc_cel_pietro
      - type: history-graph
        title: CO1 i pogoda
        hours_to_show: 24
        entities:
          - sensor.hp_poc_co1_propozycja
          - number.garaz_pompa_ciepla_circuit_1_setpoint
          - sensor.garaz_pompa_ciepla_circuit_1_water_temp
          - sensor.hp_poc_outdoor_2h
      - type: entities
        title: Dane do diagnostyki
        entities:
          - sensor.hp_poc_status
          - binary_sensor.hp_poc_dane_stref_ok
          - binary_sensor.hp_poc_brak_danych_stref
          - input_datetime.hp_poc_ostatnia_proba_co1_on_off
          - sensor.pompa_ciepla_moc
          - sensor.hp_poc_parter_liczba_probek
          - sensor.hp_poc_pietro_liczba_probek
          - sensor.hp_poc_outdoor_liczba_probek
          - sensor.hp_poc_parter_zmiana_12h
          - sensor.hp_poc_pietro_zmiana_12h
